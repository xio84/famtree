services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: famtree
      POSTGRES_PASSWORD: famtree
      POSTGRES_DB: famtree
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U famtree -d famtree"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:24-alpine
    working_dir: /app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://famtree:famtree@postgres:5432/famtree
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me-in-real-deployments}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-}
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-}
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - node-modules:/app/node_modules
      - next-cache:/app/.next
    command: >
      sh -c "apk add --no-cache libc6-compat openssl &&
             npm install &&
             npx prisma db push --skip-generate &&
             npx prisma generate &&
             npm run dev"

volumes:
  postgres-dev-data:
  node-modules:
  next-cache:
